# Backend CI — lint, types, unit tests, and a real integration run against live
# datastores. Split into three jobs so a ruff failure reports in ~40s instead of
# waiting behind a Neo4j container that takes 40s just to become healthy.
name: ci-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

# A PR that is pushed to twice in a minute should not burn two full integration
# runs. main is never cancelled: its runs gate the deploy pipeline.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- lint ---
  lint:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: ruff check
        run: python -m ruff check src tests

      - name: ruff format check
        run: python -m ruff format --check src tests
        continue-on-error: true   # formatting is advisory; ruff check is the gate

      - name: mypy
        run: python -m mypy src

  # ----------------------------------------------------------- unit tests ---
  unit:
    name: pytest (unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # The floor is a repository variable so raising it is a reviewed change
      # rather than an edit buried in a workflow diff. A true diff-coverage
      # comparison needs a base-branch artifact and degrades badly on forks,
      # so a hard floor is the honest mechanism here (docs/cicd.md).
      - name: pytest
        env:
          COVERAGE_MIN: ${{ vars.BACKEND_COVERAGE_MIN || '60' }}
        run: |
          python -m pytest \
            -m "not integration and not chaos" \
            --cov=src/aegis \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under="${COVERAGE_MIN}"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------- integration tests ---
  # Real datastores, not mocks. The same images the local compose stack uses,
  # so a schema that applies here applies there.
  integration:
    name: pytest (integration, live datastores)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/aegis-ci-neo4j
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 40s

    env:
      AEGIS_ENV: local
      AEGIS_ENVIRONMENT_NAME: github-ci
      LOG_FORMAT: json
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis-ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: aegis-ci-neo4j
      # Deterministic, non-secret CI values. Nothing here authorizes anything
      # outside this ephemeral runner.
      ALERT_INGEST_TOKEN: ci-ingest-token
      INTERNAL_SIGNING_KEY: ci-internal-signing-key
      AUTH_DEV_MODE: "true"
      AUTONOMY_ENABLED: "false"
      OTEL_TRACES_ENABLED: "false"
      LANGSMITH_TRACING: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Uses the application's own migration runner, not a hand-rolled psql
      # loop, so CI exercises the advisory lock and checksum logic that
      # production relies on. pgvector must be creatable or 005/006 fail here.
      - name: Apply migrations
        run: |
          python - <<'PY'
          import asyncio
          from aegis.core.config import get_settings
          from aegis.persistence.db import Database
          from aegis.persistence.migrate import run_migrations

          async def main() -> None:
              db = Database(get_settings())
              await db.connect()
              try:
                  applied = await run_migrations(db)
                  print(f"migrations applied: {applied or 'none (already current)'}")
              finally:
                  await db.close()

          asyncio.run(main())
          PY

      # Re-running must be a no-op. A migration that is not idempotent across
      # replicas is a production outage waiting for a rolling deploy.
      - name: Re-apply migrations (must be a no-op)
        run: |
          python - <<'PY'
          import asyncio, sys
          from aegis.core.config import get_settings
          from aegis.persistence.db import Database
          from aegis.persistence.migrate import run_migrations

          async def main() -> None:
              db = Database(get_settings())
              await db.connect()
              try:
                  applied = await run_migrations(db)
              finally:
                  await db.close()
              if applied:
                  print(f"::error::migrations re-applied on a current schema: {applied}")
                  sys.exit(1)
              print("schema stable on re-run")

          asyncio.run(main())
          PY

      # Exit code 5 is pytest's "no tests collected". There are no integration
      # tests yet; that is a gap, not a failure, so it is reported loudly and
      # the job stays green. Any collected integration test that fails DOES
      # fail the build.
      - name: pytest -m integration
        run: |
          set +e
          python -m pytest -m integration -p no:cacheprovider
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::warning title=No integration tests::backend/tests/integration is empty; live-datastore coverage is 0."
            exit 0
          fi
          exit "$code"
