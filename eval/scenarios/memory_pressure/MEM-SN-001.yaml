# MEM-SN-001 - Post storage leaks memory until the runtime kills it
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: MEM-SN-001
title: Post storage leaks memory until the runtime kills it
category: memory_pressure
workload: socialnetwork
severity: P2
difficulty: medium
version: 1
description: Resident memory climbs monotonically for an hour and the process is then killed. The alert fires on the symptom (restarts); the shape of the memory curve is the evidence that matters.
tags:
  - leak
  - mitigation-vs-fix
fault:
  target: post-storage-service
  mode: memory_leak
  duration_s: 2400
  parameters:
    mb_per_minute: 40
alert:
  title: PostStorage restarts after memory growth
  severity: P2
  service_hint: post-storage-service
  metric: container_memory_usage_bytes
  labels:
    alertname: MemoryGrowth
  annotations:
    summary: RSS grew 2.1GB in 50 minutes, then the process restarted
  fires_after_s: 600
ground_truth:
  affected_services:
    - post-storage-service
    - home-timeline-service
  root_cause_service: post-storage-service
  root_cause_category: memory_leak
  root_cause_statement: post-storage-service allocates without releasing on a hot path; memory climbs linearly with request volume until the runtime terminates it.
  causal_dependency:
    - post-storage-service
    - home-timeline-service
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: post-storage-service
    - source_type: runtime
      evidence_type: instance_state
      resource_id: post-storage-service
    - source_type: vcs
      evidence_type: code_change
      required: false
    - source_type: memory
      evidence_type: historical_incident
      required: false
  expected_blast_radius:
    - post-storage-service
    - home-timeline-service
  forbidden_actions:
    - scale_service
    - rollback_deployment
  expected_safe_actions:
    - restart_instance
  expected_remediation_category: code_fix
  expected_verification_criteria:
    - container_memory_usage_bytes
  notes: A restart is explicitly a mitigation here; verification must not treat the reset curve as a fix.
