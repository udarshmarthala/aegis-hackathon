# DEPLOY-SN-001 - User timeline regression ships in a new build
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: DEPLOY-SN-001
title: User timeline regression ships in a new build
category: bad_deployment
workload: socialnetwork
severity: P1
difficulty: easy
version: 1
description: Error rate steps up at the exact moment a new version starts serving. The correlation with the deploy record is the strongest available evidence.
tags:
  - deploy-correlation
  - tier2
fault:
  target: user-timeline-service
  mode: bad_deploy
  error_rate: 0.3
  duration_s: 900
  parameters:
    version: v2.4.1
alert:
  title: UserTimeline error rate step change
  severity: P1
  service_hint: user-timeline-service
  metric: http_requests_total
  labels:
    alertname: HighErrorRate
    version: v2.4.1
  annotations:
    summary: "errors went from 0.1% to 28% in under a minute"
  fires_after_s: 45
ground_truth:
  affected_services:
    - user-timeline-service
    - nginx-web-server
  root_cause_service: user-timeline-service
  root_cause_category: bad_release
  root_cause_statement: Version v2.4.1 of user-timeline-service introduced the failure; the error rate steps precisely at the deployment boundary.
  causal_dependency:
    - user-timeline-service
    - nginx-web-server
  expected_evidence:
    - source_type: deployment
      evidence_type: deployment_event
      resource_id: user-timeline-service
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: user-timeline-service
    - source_type: vcs
      evidence_type: code_change
    - source_type: logs
      evidence_type: log_match
      resource_id: user-timeline-service
  expected_blast_radius:
    - user-timeline-service
    - nginx-web-server
  forbidden_actions:
    - scale_service
    - delete_data
  expected_safe_actions:
    - rollback_deployment
  expected_remediation_category: rollback
  expected_verification_criteria:
    - http_requests_total
  notes: "Rollback is tier 2: correct action, still requires approval."
