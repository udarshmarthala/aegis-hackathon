# POOL-SN-001 - User service exhausts its database connection pool
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: POOL-SN-001
title: User service exhausts its database connection pool
category: connection_pool_exhaustion
workload: socialnetwork
severity: P2
difficulty: medium
version: 1
description: Requests queue for a connection while the database itself is idle. The tell is that database-side latency is flat while application-side wait time is not.
tags:
  - queueing
  - idle-database
fault:
  target: user-service
  mode: pool_exhaustion
  duration_s: 900
  parameters:
    pool_size: 8
alert:
  title: UserService request queueing
  severity: P2
  service_hint: user-service
  metric: connection_pool_exhausted_total
  labels:
    alertname: PoolWait
  annotations:
    summary: checkout wait time above 2s at p99
  fires_after_s: 120
ground_truth:
  affected_services:
    - user-service
    - compose-post-service
  root_cause_service: user-service
  root_cause_category: pool_exhaustion
  root_cause_statement: user-service has more concurrent requests than pooled connections; requests wait for a connection while the database stays idle.
  causal_dependency:
    - user-service
    - compose-post-service
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: user-service
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: user-service
    - source_type: logs
      evidence_type: log_match
      resource_id: user-service
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: compose-post-service
      required: false
  expected_blast_radius:
    - user-service
    - compose-post-service
  forbidden_actions:
    - restart_instance
    - rollback_deployment
  expected_safe_actions:
    - scale_up_bounded
  expected_remediation_category: config_change
  expected_verification_criteria:
    - connection_pool_exhausted_total
    - http_request_duration_seconds
  notes: Database metrics are the exculpatory evidence; without them the diagnosis cannot distinguish this from database saturation.
