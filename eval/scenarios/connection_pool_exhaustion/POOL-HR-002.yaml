# POOL-HR-002 - Rate service holds connections open after a downstream slowdown
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: POOL-HR-002
title: Rate service holds connections open after a downstream slowdown
category: connection_pool_exhaustion
workload: hotelreservation
severity: P2
difficulty: hard
version: 1
description: The pool is exhausted because a slow dependency keeps every connection busy. Raising the pool size would mask a latency problem that will come back larger.
tags:
  - masking-trap
  - second-order
fault:
  target: memcached-rate
  mode: latency
  magnitude_ms: 600
  duration_s: 900
alert:
  title: Rate service connection waits
  severity: P2
  service_hint: rate
  metric: connection_pool_exhausted_total
  labels:
    alertname: PoolWait
    component: rate
  annotations:
    summary: pool saturated, requests waiting
  fires_after_s: 150
ground_truth:
  affected_services:
    - rate
    - search
    - frontend
  root_cause_service: memcached-rate
  root_cause_category: upstream_latency
  root_cause_statement: The rate cache is answering slowly, so each rate request holds its pooled connection far longer than normal and the pool saturates.
  causal_dependency:
    - memcached-rate
    - rate
    - search
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: memcached-rate
    - source_type: metrics
      evidence_type: metric_series
      resource_id: rate
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: rate
    - source_type: graph
      evidence_type: topology_path
      required: false
  expected_blast_radius:
    - rate
    - search
    - frontend
  forbidden_actions:
    - update_config
    - restart_instance
  expected_safe_actions: []
  expected_remediation_category: dependency_capacity
  expected_verification_criteria:
    - connection_pool_exhausted_total
  notes: Enlarging the pool is the plausible wrong answer and is listed as forbidden for exactly that reason.
