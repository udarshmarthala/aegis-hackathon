# CORR-HR-002 - Search and recommendation degrade from one saturated dependency
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CORR-HR-002
title: Search and recommendation degrade from one saturated dependency
category: multiple_correlated_failures
workload: hotelreservation
severity: P2
difficulty: hard
version: 1
description: "Two alerts, one cause. The dependency both services call is saturated; each service's own resources are fine."
tags:
  - fan-in
  - shared-dependency
fault:
  target: geo
  mode: cpu_burn
  duration_s: 900
  parameters:
    load_pct: 94
  secondary:
    - target: recommendation
      mode: latency
      magnitude_ms: 400
      correlated_with_primary: true
alert:
  title: Search and recommendation both above latency budget
  severity: P2
  service_hint: search
  metric: http_request_duration_seconds
  labels:
    alertname: MultiServiceLatency
  annotations:
    summary: two services alerting within 30 seconds of each other
  fires_after_s: 120
ground_truth:
  affected_services:
    - search
    - recommendation
    - geo
    - frontend
  root_cause_service: geo
  root_cause_category: cpu_exhaustion
  root_cause_statement: geo is CPU saturated; search and recommendation both call it and both inherit the delay.
  causal_dependency:
    - geo
    - search
    - frontend
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: geo
    - source_type: graph
      evidence_type: blast_radius
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: search
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: recommendation
  expected_blast_radius:
    - search
    - recommendation
    - geo
    - frontend
  forbidden_actions:
    - restart_instance
  expected_safe_actions:
    - scale_up_bounded
  expected_remediation_category: horizontal_scale
  expected_verification_criteria:
    - http_request_duration_seconds
    - process_cpu_seconds_total
  notes: Both victims look self-inflicted until their own CPU and memory are shown to be normal.
