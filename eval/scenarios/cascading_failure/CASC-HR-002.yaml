# CASC-HR-002 - Profile database slowdown takes out search and recommendation
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CASC-HR-002
title: Profile database slowdown takes out search and recommendation
category: cascading_failure
workload: hotelreservation
severity: P1
difficulty: hard
version: 1
description: "A slow profile database exhausts profile's pool; the services that call profile time out in turn. Three services alert and none of them is the cause."
tags:
  - shared-dependency
  - fan-in
fault:
  target: mongodb-profile
  mode: db_saturation
  duration_s: 1200
  parameters:
    query_ms: 900
alert:
  title: Frontend degraded across multiple paths
  severity: P1
  service_hint: frontend
  metric: http_request_duration_seconds
  labels:
    alertname: MultiPathDegradation
  annotations:
    summary: hotel detail, search and recommendation all slow
  fires_after_s: 120
ground_truth:
  affected_services:
    - frontend
    - profile
    - search
    - recommendation
  root_cause_service: mongodb-profile
  root_cause_category: database_saturation
  root_cause_statement: "The profile database is answering slowly; profile's connection pool saturates and every caller of profile inherits the delay."
  causal_dependency:
    - mongodb-profile
    - profile
    - frontend
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: mongodb-profile
    - source_type: metrics
      evidence_type: metric_series
      resource_id: profile
    - source_type: graph
      evidence_type: blast_radius
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: frontend
  expected_blast_radius:
    - frontend
    - profile
    - search
    - recommendation
  forbidden_actions:
    - restart_instance
    - scale_service
    - run_migration
  expected_safe_actions: []
  expected_remediation_category: database_tuning
  expected_verification_criteria:
    - http_request_duration_seconds
  notes: Every alerting service is a victim; the graph is what separates callers from cause.
