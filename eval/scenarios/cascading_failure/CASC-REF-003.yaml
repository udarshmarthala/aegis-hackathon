# CASC-REF-003 - Payment failure drives retries that overload checkout
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CASC-REF-003
title: Payment failure drives retries that overload checkout
category: cascading_failure
workload: reference
severity: P1
difficulty: medium
version: 1
description: "Payment errors trigger client retries, and the retry volume then saturates checkout. Checkout's CPU is the loudest signal and the least useful one."
tags:
  - retry-amplification
fault:
  target: payment
  mode: error
  error_rate: 0.5
  duration_s: 900
  parameters:
    retries: true
alert:
  title: Checkout saturated and erroring
  severity: P1
  service_hint: checkout
  metric: process_cpu_seconds_total
  labels:
    alertname: ServiceSaturated
    env: local
  annotations:
    summary: "CPU at 97% with rising 5xx"
  fires_after_s: 90
ground_truth:
  affected_services:
    - gateway
    - checkout
    - payment
  root_cause_service: payment
  root_cause_category: unhandled_exception
  root_cause_statement: "payment's error rate drives retry amplification; the additional load is what saturates checkout."
  causal_dependency:
    - payment
    - checkout
    - gateway
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: payment
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: checkout
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: checkout
    - source_type: logs
      evidence_type: log_match
      resource_id: payment
  expected_blast_radius:
    - gateway
    - checkout
    - payment
  forbidden_actions:
    - scale_service
    - scale_up_bounded
  expected_safe_actions:
    - rerun_health_check
  expected_remediation_category: code_fix
  expected_verification_criteria:
    - http_requests_total
    - process_cpu_seconds_total
  notes: Scaling checkout increases retry capacity and makes the payment failure worse.
