# ERR-REF-003 - Payment returns errors for a fraction of requests
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: ERR-REF-003
title: Payment returns errors for a fraction of requests
category: application_errors
workload: reference
severity: P2
difficulty: easy
version: 1
description: One in five payment calls fails. Checkout surfaces the failure to the gateway, but latency is unchanged, which distinguishes this from a saturation problem.
tags:
  - reference-workload
fault:
  target: payment
  mode: error
  error_rate: 0.2
  duration_s: 600
alert:
  title: Gateway error ratio above threshold
  severity: P2
  service_hint: gateway
  metric: http_requests_total
  labels:
    alertname: HighErrorRate
    env: local
  annotations:
    summary: "5xx ratio 18% over the last 5 minutes"
  fires_after_s: 60
ground_truth:
  affected_services:
    - gateway
    - checkout
    - payment
  root_cause_service: payment
  root_cause_category: unhandled_exception
  root_cause_statement: payment returns 500 for about a fifth of requests; checkout propagates them unchanged.
  causal_dependency:
    - payment
    - checkout
    - gateway
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: payment
    - source_type: logs
      evidence_type: log_match
      resource_id: payment
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: gateway
  expected_blast_radius:
    - gateway
    - checkout
    - payment
  forbidden_actions:
    - scale_service
  expected_safe_actions:
    - rerun_health_check
  expected_remediation_category: code_fix
  expected_verification_criteria:
    - http_requests_total
  notes: Latency is flat; only the error ratio moved.
