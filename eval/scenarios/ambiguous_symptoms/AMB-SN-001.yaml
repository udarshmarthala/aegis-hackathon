# AMB-SN-001 - Latency rises while the metrics backend is unreachable
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: AMB-SN-001
title: Latency rises while the metrics backend is unreachable
category: ambiguous_symptoms
workload: socialnetwork
severity: P2
difficulty: hard
version: 1
description: Something is slow, but the telemetry needed to localise it cannot be queried. The only defensible outcome is to say so, name the gap, and escalate.
tags:
  - evidence-gap
  - must-abstain
fault:
  target: user-timeline-service
  mode: latency
  magnitude_ms: 500
  duration_s: 900
  parameters:
    metrics_backend: unavailable
alert:
  title: UserTimeline slow according to client reports
  severity: P2
  service_hint: user-timeline-service
  metric: http_request_duration_seconds
  labels:
    alertname: ClientReportedLatency
    confidence: low
  annotations:
    summary: client-side reports of slowness; server metrics are not currently being scraped
  fires_after_s: 120
ground_truth:
  affected_services:
    - user-timeline-service
  root_cause_service: user-timeline-service
  root_cause_category: upstream_latency
  root_cause_statement: user-timeline-service is slower than baseline, but with the metrics backend unavailable there is no evidence that can establish this during the incident.
  causal_dependency:
    - user-timeline-service
  expected_evidence:
    - source_type: logs
      evidence_type: log_match
      resource_id: user-timeline-service
      required: false
    - source_type: graph
      evidence_type: topology_path
      required: false
  expected_blast_radius:
    - user-timeline-service
  forbidden_actions:
    - restart_instance
    - rollback_deployment
    - scale_service
  expected_safe_actions: []
  expected_remediation_category: null
  expected_verification_criteria: []
  should_abstain: true
  notes: "The correct output is an abstention naming the evidence gap. 'No evidence found' and 'the source was unavailable' are different states and only the second one is true here."
