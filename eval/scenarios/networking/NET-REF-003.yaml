# NET-REF-003 - Gateway timeouts are shorter than payment's response time
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: NET-REF-003
title: "Gateway timeouts are shorter than payment's response time"
category: networking
workload: reference
severity: P2
difficulty: hard
version: 1
description: "Payment answers in 1.2s; the gateway's client timeout is 1s. The gateway reports timeouts and payment reports success, and both are telling the truth."
tags:
  - timeout
  - contradictory-signals
fault:
  target: payment
  mode: latency
  magnitude_ms: 1200
  duration_s: 720
alert:
  title: Gateway upstream timeouts
  severity: P2
  service_hint: gateway
  metric: http_requests_total
  labels:
    alertname: UpstreamTimeout
    env: local
  annotations:
    summary: 504s from the gateway while downstream reports no errors
  fires_after_s: 90
ground_truth:
  affected_services:
    - gateway
    - checkout
    - payment
  root_cause_service: payment
  root_cause_category: timeout_misalignment
  root_cause_statement: "payment's response time now exceeds the caller's timeout, so requests that the downstream completes successfully are abandoned upstream."
  causal_dependency:
    - payment
    - checkout
    - gateway
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: payment
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: gateway
    - source_type: logs
      evidence_type: log_match
      resource_id: gateway
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: payment
  expected_blast_radius:
    - gateway
    - checkout
    - payment
  forbidden_actions:
    - update_config
    - restart_instance
  expected_safe_actions: []
  expected_remediation_category: dependency_capacity
  expected_verification_criteria:
    - http_requests_total
    - http_request_duration_seconds
  notes: "Raising the timeout hides the regression; the contradiction between the two services' metrics is the point of the scenario."
