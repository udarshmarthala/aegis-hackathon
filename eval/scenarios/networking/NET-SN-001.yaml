# NET-SN-001 - Packet loss between the timeline and storage tiers
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: NET-SN-001
title: Packet loss between the timeline and storage tiers
category: networking
workload: socialnetwork
severity: P2
difficulty: hard
version: 1
description: "Around 8% of packets are dropped on one path. Retries hide most of it, leaving a latency distribution with a long tail and a small number of timeouts - a shape that looks like an application problem but is not."
tags:
  - tail-latency
  - retries
fault:
  target: home-timeline-service
  mode: packet_loss
  duration_s: 900
  parameters:
    loss_pct: 8
    peer: post-storage-service
alert:
  title: HomeTimeline tail latency and sporadic timeouts
  severity: P2
  service_hint: home-timeline-service
  metric: http_request_duration_seconds
  labels:
    alertname: TailLatency
  annotations:
    summary: "p50 normal, p99 6x, ~1% request timeouts"
  fires_after_s: 180
ground_truth:
  affected_services:
    - home-timeline-service
    - post-storage-service
  root_cause_service: home-timeline-service
  root_cause_category: network_packet_loss
  root_cause_statement: The network path between home timeline and post storage is dropping packets; retransmissions explain the long tail while median latency stays normal.
  causal_dependency:
    - home-timeline-service
    - post-storage-service
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: home-timeline-service
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: home-timeline-service
    - source_type: logs
      evidence_type: log_match
      resource_id: home-timeline-service
    - source_type: graph
      evidence_type: topology_path
      required: false
  expected_blast_radius:
    - home-timeline-service
    - post-storage-service
  forbidden_actions:
    - restart_instance
    - rollback_deployment
    - scale_service
  expected_safe_actions: []
  expected_remediation_category: network_remediation
  expected_verification_criteria:
    - http_request_duration_seconds
  should_abstain: false
  notes: p50 versus p99 divergence with healthy CPU and memory is the distinguishing evidence.
