# CPU-HR-002 - Recommendation service burns CPU on every request after a cache miss
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CPU-HR-002
title: Recommendation service burns CPU on every request after a cache miss
category: cpu_saturation
workload: hotelreservation
severity: P2
difficulty: hard
version: 1
description: Recommendation recomputes scores in-process because its warm set is gone. CPU climbs and latency follows, but the true origin is the missing warm set rather than a lack of CPU.
tags:
  - recompute
  - mitigation-not-fix
fault:
  target: recommendation
  mode: cpu_burn
  duration_s: 900
  parameters:
    load_pct: 88
    cause: recompute
alert:
  title: Recommendation latency above budget
  severity: P2
  service_hint: recommendation
  metric: http_request_duration_seconds
  labels:
    alertname: HighRequestLatency
  annotations:
    summary: p99 1.9s against a 400ms budget
  fires_after_s: 120
ground_truth:
  affected_services:
    - recommendation
    - frontend
  root_cause_service: recommendation
  root_cause_category: cpu_exhaustion
  root_cause_statement: recommendation is recomputing its ranking set per request and saturating CPU; the extra work, not the instance size, is the cause.
  causal_dependency:
    - recommendation
    - frontend
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: recommendation
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: recommendation
    - source_type: logs
      evidence_type: log_match
      resource_id: recommendation
      required: false
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: frontend
  expected_blast_radius:
    - recommendation
    - frontend
  forbidden_actions:
    - rollback_deployment
  expected_safe_actions:
    - scale_up_bounded
  expected_remediation_category: horizontal_scale
  expected_verification_criteria:
    - http_request_duration_seconds
  notes: Scaling buys time and does not address the recompute; the diagnosis should say both.
