# CPU-SN-001 - Nginx front end saturates a CPU during a traffic burst
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CPU-SN-001
title: Nginx front end saturates a CPU during a traffic burst
category: cpu_saturation
workload: socialnetwork
severity: P2
difficulty: easy
version: 1
description: The web tier pins its CPU, queues requests and adds latency to everything behind it. Backend services stay fast, which is the distinguishing signal.
tags:
  - edge
  - queueing
fault:
  target: nginx-web-server
  mode: cpu_burn
  duration_s: 600
  parameters:
    load_pct: 95
alert:
  title: Web tier latency and CPU both elevated
  severity: P2
  service_hint: nginx-web-server
  metric: process_cpu_seconds_total
  labels:
    alertname: HighCpu
    tier: edge
  annotations:
    summary: "CPU pinned at 95% for 8 minutes, p99 doubled"
  fires_after_s: 120
ground_truth:
  affected_services:
    - nginx-web-server
  root_cause_service: nginx-web-server
  root_cause_category: cpu_exhaustion
  root_cause_statement: The web front end is CPU bound; request queueing at the edge accounts for the whole latency increase.
  causal_dependency:
    - nginx-web-server
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: nginx-web-server
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: compose-post-service
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: nginx-web-server
  expected_blast_radius:
    - nginx-web-server
  forbidden_actions:
    - rollback_deployment
    - restart_instance
  expected_safe_actions:
    - scale_up_bounded
  expected_remediation_category: horizontal_scale
  expected_verification_criteria:
    - process_cpu_seconds_total
    - http_request_duration_seconds
  notes: Backend service latency is flat; the queue is at the edge.
