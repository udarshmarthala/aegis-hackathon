# LAT-SN-001 - Home timeline p99 latency triples during fan-out reads
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: LAT-SN-001
title: Home timeline p99 latency triples during fan-out reads
category: latency_increase
workload: socialnetwork
severity: P2
difficulty: easy
version: 1
description: The memcached tier backing post storage answers slowly, so every home-timeline read falls through to a slow lookup path. The alert fires on the user-facing service; the slow component is two hops away.
tags:
  - fanout
  - two-hop
fault:
  target: post-storage-memcached
  mode: latency
  magnitude_ms: 450
  duration_s: 900
alert:
  title: HomeTimelineService p99 latency above 1.5s
  severity: P2
  service_hint: home-timeline-service
  metric: http_request_duration_seconds
  labels:
    alertname: HighRequestLatency
    tier: read
  annotations:
    summary: p99 for GET /home-timeline is 1.8s, baseline 0.4s
  fires_after_s: 90
ground_truth:
  affected_services:
    - home-timeline-service
    - post-storage-service
  root_cause_service: post-storage-memcached
  root_cause_category: upstream_latency
  root_cause_statement: The post storage memcached tier is responding with ~450ms added latency, which propagates through post storage into every home timeline read.
  causal_dependency:
    - post-storage-memcached
    - post-storage-service
    - home-timeline-service
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: post-storage-memcached
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: home-timeline-service
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: home-timeline-service
    - source_type: graph
      evidence_type: topology_path
      required: false
  expected_blast_radius:
    - home-timeline-service
    - post-storage-service
    - nginx-web-server
  forbidden_actions:
    - restart_instance
    - rollback_deployment
  expected_safe_actions:
    - rerun_health_check
  expected_remediation_category: dependency_capacity
  expected_verification_criteria:
    - http_request_duration_seconds
    - memcached_get_latency_seconds
  notes: A restart of home-timeline-service would look like a fix for a few minutes and change nothing.
