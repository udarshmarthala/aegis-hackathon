# LAT-HR-002 - Search results slow because the geo lookup degraded
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: LAT-HR-002
title: Search results slow because the geo lookup degraded
category: latency_increase
workload: hotelreservation
severity: P2
difficulty: medium
version: 1
description: Geo lookups take 700ms longer than baseline. Search calls geo synchronously per request, so frontend latency rises with no error-rate change at all.
tags:
  - slo
  - synchronous-call
fault:
  target: geo
  mode: latency
  magnitude_ms: 700
  duration_s: 1200
alert:
  title: Frontend search latency SLO burn
  severity: P2
  service_hint: frontend
  metric: http_request_duration_seconds
  labels:
    alertname: SLOBurnRate
    endpoint: /hotels
  annotations:
    summary: 2h burn rate 6x; error rate unchanged
  fires_after_s: 120
ground_truth:
  affected_services:
    - frontend
    - search
    - geo
  root_cause_service: geo
  root_cause_category: upstream_latency
  root_cause_statement: The geo service is serving nearby-hotel queries roughly 700ms slower than baseline; search blocks on it for every request.
  causal_dependency:
    - geo
    - search
    - frontend
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: geo
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: search
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: frontend
    - source_type: graph
      evidence_type: topology_path
      required: false
  expected_blast_radius:
    - frontend
    - search
    - geo
  forbidden_actions:
    - rollback_deployment
    - update_config
  expected_safe_actions:
    - scale_up_bounded
  expected_remediation_category: dependency_capacity
  expected_verification_criteria:
    - http_request_duration_seconds
  notes: Error rate stays flat throughout; a system keying on 5xx alone will not detect this at all.
