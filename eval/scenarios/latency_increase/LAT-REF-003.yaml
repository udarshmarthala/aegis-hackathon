# LAT-REF-003 - Checkout slows because payment added request delay
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: LAT-REF-003
title: Checkout slows because payment added request delay
category: latency_increase
workload: reference
severity: P3
difficulty: easy
version: 1
description: The payment service answers 300ms slower. Checkout is the only caller, and the gateway alert fires on the aggregate.
tags:
  - reference-workload
fault:
  target: payment
  mode: latency
  magnitude_ms: 300
  duration_s: 600
alert:
  title: Gateway p95 latency regression
  severity: P3
  service_hint: gateway
  metric: http_request_duration_seconds
  labels:
    alertname: LatencyRegression
    env: local
  annotations:
    summary: p95 moved from 120ms to 430ms over 10 minutes
  fires_after_s: 60
ground_truth:
  affected_services:
    - gateway
    - checkout
    - payment
  root_cause_service: payment
  root_cause_category: upstream_latency
  root_cause_statement: The payment service is adding roughly 300ms per call; checkout and the gateway simply inherit it.
  causal_dependency:
    - payment
    - checkout
    - gateway
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: payment
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: gateway
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: checkout
  expected_blast_radius:
    - gateway
    - checkout
    - payment
  forbidden_actions:
    - rollback_deployment
  expected_safe_actions:
    - rerun_health_check
  expected_remediation_category: dependency_capacity
  expected_verification_criteria:
    - http_request_duration_seconds
  notes: The simplest possible chain; a system that cannot localise this one cannot localise anything.
