# CACHE-HR-002 - Rate cache evicts continuously under memory pressure
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CACHE-HR-002
title: Rate cache evicts continuously under memory pressure
category: cache_failure
workload: hotelreservation
severity: P2
difficulty: hard
version: 1
description: The cache is up and answering, but its hit ratio has collapsed because it is evicting as fast as it fills. Nothing is down, which makes this harder than an outage.
tags:
  - eviction
  - everything-looks-up
fault:
  target: memcached-rate
  mode: cache_flush
  duration_s: 1200
  parameters:
    mode: continuous_eviction
alert:
  title: Rate lookups slower than budget
  severity: P2
  service_hint: rate
  metric: http_request_duration_seconds
  labels:
    alertname: HighRequestLatency
    component: rate
  annotations:
    summary: p99 900ms against a 200ms budget; no errors
  fires_after_s: 180
ground_truth:
  affected_services:
    - rate
    - search
    - frontend
  root_cause_service: memcached-rate
  root_cause_category: cache_eviction_pressure
  root_cause_statement: The rate cache is evicting entries almost immediately, so the hit ratio has fallen and most lookups pay the full database path.
  causal_dependency:
    - memcached-rate
    - rate
    - search
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: memcached-rate
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: rate
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: rate
      required: false
    - source_type: runbook
      evidence_type: historical_incident
      required: false
  expected_blast_radius:
    - rate
    - search
    - frontend
  forbidden_actions:
    - clear_cache_key
    - restart_instance
  expected_safe_actions: []
  expected_remediation_category: cache_capacity
  expected_verification_criteria:
    - cache_hit_ratio
  notes: Every component reports healthy; only the hit ratio tells the story.
