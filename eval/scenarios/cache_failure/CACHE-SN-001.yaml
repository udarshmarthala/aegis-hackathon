# CACHE-SN-001 - Timeline cache is flushed and the origin is overwhelmed
# Ground truth below is the answer key. It is never handed to Aegis:
# the harness passes only Scenario.to_input() (the alert) to the system
# under test, and the fault spec goes to the independent injector.
id: CACHE-SN-001
title: Timeline cache is flushed and the origin is overwhelmed
category: cache_failure
workload: socialnetwork
severity: P1
difficulty: medium
version: 1
description: The cache is emptied at a single instant. Every subsequent read misses and lands on the database at once, so the database looks like the problem while the cause is the empty cache.
tags:
  - stampede
  - inverted-blame
fault:
  target: post-storage-memcached
  mode: cache_flush
  duration_s: 600
alert:
  title: PostStorage database load spike
  severity: P1
  service_hint: post-storage-service
  metric: http_requests_total
  labels:
    alertname: OriginLoadSpike
    tier: storage
  annotations:
    summary: origin read volume up 20x within one minute
  fires_after_s: 60
ground_truth:
  affected_services:
    - post-storage-service
    - home-timeline-service
    - post-storage-mongodb
  root_cause_service: post-storage-memcached
  root_cause_category: cache_stampede
  root_cause_statement: The post storage cache lost its entire working set, so concurrent misses for the same keys all reached the database simultaneously.
  causal_dependency:
    - post-storage-memcached
    - post-storage-service
    - home-timeline-service
  expected_evidence:
    - source_type: metrics
      evidence_type: metric_series
      resource_id: post-storage-memcached
    - source_type: metrics
      evidence_type: metric_comparison
      resource_id: post-storage-mongodb
    - source_type: traces
      evidence_type: trace_pattern
      resource_id: post-storage-service
    - source_type: graph
      evidence_type: topology_path
      required: false
  expected_blast_radius:
    - post-storage-service
    - home-timeline-service
    - post-storage-mongodb
    - nginx-web-server
  forbidden_actions:
    - clear_cache_key
    - delete_data
    - restart_instance
  expected_safe_actions: []
  expected_remediation_category: cache_warm
  expected_verification_criteria:
    - cache_hit_ratio
    - http_requests_total
  notes: Clearing cache keys is the exactly-wrong action and is forbidden here; the hit-ratio series is what identifies the real origin.
