# Scrape config for the local production simulator.
# The `service` label is what Aegis binds into its PromQL templates, so every
# job must set it consistently.
global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local
    cluster: aegis-local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { service: prometheus }

  - job_name: aegis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: aegis-api }

  # The workload Aegis observes, from a generated target list.
  #
  # A hand-maintained list would have to be edited every time a topology gains
  # a service, and the failure when someone forgets is the worst kind: the
  # container runs, the fault is injected, nothing scrapes it, and Aegis records
  # an evidence gap for a service that was screaming.
  #
  # So the list is generated by eval/topology.py from the same files that define
  # the graphs, and CI fails when it is stale. file_sd rather than docker_sd
  # because docker_sd needs the daemon socket, and a metrics scraper is the last
  # process that should be able to list - or reach - every container on the box.
  # file_sd is also hot-reloaded, so a topology change needs no restart.
  - job_name: workload
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
        refresh_interval: 10s
