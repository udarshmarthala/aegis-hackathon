[project]
name = "aegis"
version = "2.0.0"
description = "Aegis - evidence-driven AI SRE control plane"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "redis>=5.2.0",
  "neo4j>=5.26.0",
  "httpx>=0.27.2",
  "structlog>=24.4.0",
  "python-ulid>=3.0.0",
  "orjson>=3.10.11",
  "sse-starlette>=2.1.3",
  "python-multipart>=0.0.17",
  "tenacity>=9.0.0",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0.7",
  "langchain-core>=0.3.21",
  "langchain-openai>=0.2.10",
  "langsmith>=0.1.140",
  "firebase-admin>=6.6.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-asyncpg>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "prometheus-client>=0.21.0",
  "docker>=7.1.0",
  "pyyaml>=6.0.2",
  # The horizon brain: Claude on Bedrock through the Anthropic SDK (SigV4 via
  # boto3/botocore), and the MCP client for remote toolsets.
  "anthropic[bedrock]>=0.70",
  "boto3>=1.35",
  "mcp>=1.9",

  # Transitive, pinned here on purpose. firebase-admin -> cachecontrol pulls
  # msgpack with a floor of 0.5.2, which resolves to 1.1.2 and carries
  # GHSA-6v7p-g79w-8964: an out-of-bounds read in the unpacker. Aegis never
  # unpacks msgpack from an untrusted source itself, but the image scan is a
  # supply-chain gate, not a reachability argument, and the fix is a version
  # bump with no API change. Remove this line once cachecontrol raises its own
  # floor past 1.2.1.
  "msgpack>=1.2.2",
]

[project.optional-dependencies]
# The stdio MCP transport in ``aegis.mcp.server``. Optional on purpose: the
# internal tool boundary - registry, invoker, gate chain - is pure Aegis code
# and must keep working when this package is absent, so an external transport
# can never be a reason the control plane fails to boot. ``server_status()``
# reports which of the two states this process is in.
mcp = [
  "mcp>=1.0",
]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-pyyaml>=6.0.12",
  "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "ASYNC", "S", "T20"]
ignore = [
  "S101",   # assert is used for internal invariants, not input validation
  "B008",   # FastAPI Depends() in defaults is the framework idiom
  "A003",   # shadowing a builtin as a method name (e.g. list) reads better here
  # Domain exceptions are named for the condition they represent
  # (PolicyViolation, LeaseConflict, CircuitOpen). Forcing an "Error" suffix
  # would make the safety vocabulary read worse at every call site.
  "N818",
  # PEP 695 generics require no runtime benefit here and TypeVar keeps the
  # signatures readable to reviewers on older toolchains.
  "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "T20"]
# S608 flags f-string SQL. Audited: every interpolated fragment in these modules
# is a module constant or a literal chosen by a boolean - never caller input.
# All *values* are asyncpg bind parameters. Reviewed 2026-09-18.
"src/aegis/persistence/incidents.py" = ["S608"]
"src/aegis/persistence/jobs.py" = ["S608"]
"src/aegis/evidence/store.py" = ["S608"]
# The Executor protocol fixes every rollback signature. An action with no
# inverse (a restart, a cache eviction) implements it as an explicit, audited
# no-op and legitimately ignores arguments the contract still requires.
"src/aegis/execution/executors.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  # asyncpg ships no py.typed marker, so its Records and connections arrive as
  # Any. Repository methods re-declare their own return types rather than
  # letting that Any leak past the persistence boundary.
  "asyncpg.*",
  "neo4j.*", "docker.*", "firebase_admin.*", "langgraph.*", "pgvector.*",
  # Optional environment adapters. Compose is the supported local backend, so
  # these ship untyped and unimported unless a cluster install adds them.
  "kubernetes.*", "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires live infrastructure",
  "chaos: dependency-failure simulation",
]
